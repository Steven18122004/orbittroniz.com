body{margin:0;background:#060a18;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;padding:12px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.grid-2{grid-template-columns:1fr}}

.tool::before{content:'';display:block;height:4px;background:linear-gradient(90deg,var(--purple),var(--cyan),#f59e0b);border-radius:18px 18px 0 0;margin:-14px -14px 12px -14px}
canvas{max-width:100%;border-radius:12px;background:#0a1224;display:block}

@keyframes logoGlow{0%{box-shadow:0 10px 36px rgba(0,0,0,.7)}100%{box-shadow:0 16px 48px rgba(0,0,0,.85),0 0 48px rgba(124,58,237,.75),0 0 72px rgba(34,211,238,.6)}}

    if(showOnlyFav && favs.indexOf(t.id)===-1) return;
    if(!showOnlyFav && currentCat!=='all' && t.cat!==currentCat) return;
    if(q && t.name.toLowerCase().indexOf(q)===-1) return;
    var d=document.createElement('div'); d.className='tcard';
    d.innerHTML='<span class="fav" onclick="event.stopPropagation();toggleFav('+t.id+')">'+(favs.indexOf(t.id)>-1?"⭐":"☆")+'</span><span>'+t.icon+'</span><b>'+t.id+'. '+t.name+'</b><small>'+t.desc+' • '+t.cat+'</small>';
    d.onclick=function(){ openTool(t.id); }; grid.appendChild(d);
  });
  document.getElementById('favCount').innerText=favs.length; document.getElementById('favCount2').innerText=favs.length;
  var rb=document.getElementById('recentBox'); rb.innerHTML=""; if(!recents.length) rb.innerHTML='<small style="color:#94a3b8">No recent yet</small>';

function doNumWords(){ var n=parseInt(document.getElementById('n49').value)||0; var ones=["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"]; var tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"]; function two(x){ if(x<20) return ones[x]; return tens[Math.floor(x/10)]+(x%10?" "+ones[x%10]:""); } function three(x){ var h=Math.floor(x/100), r=x%100; return (h?ones[h]+" Hundred":"")+(h&&r?" ":"")+(r?two(r):""); } var out=""; var num=n; if(num>=10000000){ out+=three(Math.floor(num/10000000))+" Crore "; num%=10000000; } if(num>=100000){ out+=three(Math.floor(num/100000))+" Lakh "; num%=100000; } if(num>=1000){ out+=three(Math.floor(num/1000))+" Thousand "; num%=1000; } if(num>0) out+=three(num); document.getElementById('r49').innerText=(out||"Zero")+" Rupees Only"; }
function doRandomPick(){ var names=document.getElementById('t50').value.split(',').map(function(s){return s.trim()}).filter(function(s){return s}); if(!names.length) return alert("Enter names"); document.getElementById('r50').innerText="🎉 Winner: "+names[Math.floor(Math.random()*names.length)]; }
