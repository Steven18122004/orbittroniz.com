<script>
(function(){
let ttsHistory=[], currentVoice={id:'rachel',name:'Rachel'}, progressInterval=null;
function initApp(){
  const ta=document.getElementById('ttsText');
  if(ta){ ta.oninput=function(){ document.getElementById('ttsCharCount').innerText=this.value.length+' / 10000 characters'; }; }
  const emo=document.getElementById('emotionIntensity');
  if(emo){ emo.oninput=function(){ document.getElementById('emotionVal').innerText=this.value+'%'; const em=document.getElementById('emotion'); if(em) document.getElementById('ttsEmotionName').innerText=em.value.split('•')[0].trim()+' '+this.value+'%'; }; }
  const pitch=document.getElementById('pitch');
  if(pitch){ pitch.oninput=function(){ document.getElementById('pitchVal').innerText=this.value; }; }
  const clone=document.getElementById('cloneUpload');
  if(clone){ clone.onchange=function(e){ const file=e.target.files[0]; if(file){ const div=document.createElement('div'); div.style.cssText='background:#000; border:1px solid #22c55e33; border-radius:8px; padding:8px; display:flex; justify-content:space-between; align-items:center; margin-top:6px;'; div.innerHTML=`<span style="color:#22c55e; font-size:9px; font-weight:700;">✅ ${file.name}</span><span style="background:#22c55e; color:#000; font-size:7px; padding:2px 6px; border-radius:10px; font-weight:900;">CLONED</span>`; const list=document.getElementById('clonedList'); if(list){ list.innerHTML=''; list.appendChild(div); } } }; }
}
window.insertTag=function(tag){ const ta=document.getElementById('ttsText'); const start=ta.selectionStart; const end=ta.selectionEnd; ta.value=ta.value.substring(0,start)+tag+ta.value.substring(end); ta.focus(); ta.selectionStart=ta.selectionEnd=start+tag.length; const cc=document.getElementById('ttsCharCount'); if(cc) cc.innerText=ta.value.length+' / 10000 characters'; };
window.filterVoice=function(type){
  document.querySelectorAll('[id^=filter-]').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('filter-'+type); if(btn) btn.classList.add('active');
  const cards=document.querySelectorAll('.voice3d');
  cards.forEach(card=>{ if(type==='all'){ card.style.display='block'; } else { const gender=card.dataset.gender; const age=card.dataset.age; const accent=card.dataset.accent; if(gender===type || age===type || accent===type) card.style.display='block'; else card.style.display='none'; } });
};
window.selectVoice=function(id,name,desc){
  document.querySelectorAll('.voice3d').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('voice-'+id); if(el) el.classList.add('active');
  currentVoice={id:id,name:name,desc:desc};
  const vn=document.getElementById('ttsVoiceName'); if(vn) vn.innerText=name;
};
window.setVoiceEffect=function(effect){ document.querySelectorAll('[onclick^="setVoiceEffect"]').forEach(b=>{ if(b.textContent.toLowerCase().includes(effect) || (effect==='normal' && b.textContent.includes('Normal'))) b.classList.add('active'); else b.classList.remove('active'); }); };
window.cloneVoice=function(){ const input=document.getElementById('cloneUpload'); if(!input || !input.files[0]){ alert('Upload voice sample first - MP3/WAV - 30sec - Any voice - Will clone'); if(input) input.click(); return; } alert('🧬 Cloning voice... Extra feature - Voice cloning from 30sec sample - Would create new voice in library'); };
window.clearCloned=function(){ const list=document.getElementById('clonedList'); if(list) list.innerHTML='<div style="background:#111; border:1px solid #1a1a1a; border-radius:8px; padding:8px; display:flex; justify-content:space-between;"><span style="color:#666; font-size:9px;">No cloned voices yet</span><span style="background:#22c55e11; border:1px solid #22c55e22; color:#22c55e; font-size:7px; padding:2px 6px; border-radius:10px;">NEW</span></div>'; };
window.switchMain=function(name){
  document.querySelectorAll('.mainTool').forEach(t=>t.style.display='none');
  document.querySelectorAll('[id^=nav-]').forEach(b=>{ b.classList.remove('active'); b.style.color='#666'; });
  const tool=document.getElementById('tool-'+name); if(tool) tool.style.display='block';
  const btn=document.getElementById('nav-'+name); if(btn){ btn.classList.add('active'); btn.style.color='#000'; }
};
window.generateTTS=function(){
  const ta=document.getElementById('ttsText'); if(!ta) return;
  const text=ta.value.trim(); if(!text){ alert('Enter text first! Try emotion tags: [Happy] [Sad] [Whisper] [Laugh]'); return; }
  const wave=document.getElementById('ttsWave'); if(wave) wave.style.display='block';
  let prog=0; const pBar=document.getElementById('ttsProgress'); if(pBar) pBar.style.width='0%';
  progressInterval=setInterval(()=>{ prog+=Math.random()*20; if(prog>92) prog=92; if(pBar) pBar.style.width=prog+'%'; },220);
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(text.replace(/\[.*?\]/g,''));
    const voices=speechSynthesis.getVoices();
    if(currentVoice.id==='rachel' || currentVoice.id==='bella' || currentVoice.id==='elli'){
      const fVoice=voices.find(v=>v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha'));
      if(fVoice) utter.voice=fVoice;
    } else {
      const mVoice=voices.find(v=>v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('alex'));
      if(mVoice) utter.voice=mVoice;
    }
    const speedEl=document.getElementById('speed'); if(speedEl) utter.rate=parseFloat(speedEl.value);
    const emotionEl=document.getElementById('emotion'); if(emotionEl){
      const emotion=emotionEl.value;
      if(emotion.includes('Whisper')){ utter.volume=0.5; utter.rate=0.8; } else if(emotion.includes('Shout') || emotion.includes('Angry')){ utter.volume=1; utter.rate=1.3; }
    }
    const pitchEl=document.getElementById('pitch'); if(pitchEl){ const pitchVal=parseInt(pitchEl.value); if(pitchVal!==0){ utter.pitch=1+(pitchVal/20); } }
    utter.onend=function(){ clearInterval(progressInterval); if(pBar) pBar.style.width='100%'; setTimeout(()=>{ if(wave) wave.style.display='none'; },800); const audio=document.getElementById('ttsAudio'); if(audio) audio.style.display='block'; const emoEl=document.getElementById('emotion'); const emoText=emoEl?emoEl.value.split('•')[0]:'Happy'; ttsHistory.unshift({text:text.substring(0,70)+'...', voice:currentVoice.name, emotion:emoText, time:Date.now(), fullText:text}); renderTTSHistory(); };
    setTimeout(()=>speechSynthesis.speak(utter), 600);
  } else { clearInterval(progressInterval); if(wave) wave.style.display='none'; alert('TTS not supported - Use Chrome/Edge'); }
};
window.regenerateTTS=function(){ generateTTS(); };
window.playTTS=function(){ const ta=document.getElementById('ttsText'); if(!ta) return; const text=ta.value.trim(); if(!text){ alert('Enter text!'); return; } if('speechSynthesis' in window){ speechSynthesis.cancel(); const utter=new SpeechSynthesisUtterance(text.replace(/\[.*?\]/g,'')); const speedEl=document.getElementById('speed'); if(speedEl) utter.rate=parseFloat(speedEl.value); speechSynthesis.speak(utter); } };
window.downloadTTS=function(){ const ta=document.getElementById('ttsText'); if(!ta) return; const text=ta.value.trim(); if(!text){ alert('Generate first!'); return; } const keyEl=document.getElementById('elevenKey'); const key=keyEl?keyEl.value.trim():''; if(key){ alert('With API key - Would download HD MP3 - Voice: '+currentVoice.name); } else { const blob=new Blob([text], {type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='TTS-'+currentVoice.name+'-'+Date.now()+'.txt'; a.click(); alert('Downloaded text - Add API key for real MP3 HD download'); } };
window.copyTTS=function(){ const ta=document.getElementById('ttsText'); if(ta && ta.value) navigator.clipboard.writeText(ta.value).then(()=>{ const fs=document.getElementById('finalStatus'); if(fs) fs.innerText='✅ Copied'; }); };
window.shareTTS=function(){ const ta=document.getElementById('ttsText'); if(navigator.share && ta){ navigator.share({title:'My TTS Voice '+currentVoice.name, text:ta.value.substring(0,100)}); } else { alert('Share: TTS ready to share!'); } };
window.addTTSToVideo=function(){ alert('✅ TTS audio would be added to Video Generator timeline - Tool 2'); };
function renderTTSHistory(){ const list=document.getElementById('ttsHistory'); if(!list) return; if(ttsHistory.length===0){ list.innerHTML='<div style="color:#333; font-size:11px; padding:14px; text-align:center;">No history</div>'; return; } list.innerHTML=''; ttsHistory.slice(0,8).forEach((h,i)=>{ const d=document.createElement('div'); d.style.cssText='background:linear-gradient(145deg,#0a0a0a,#000); border:1px solid #1a1a1a; border-radius:14px; padding:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 6px 18px #000;'; d.innerHTML=`<div style="flex:1;"><div style="color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; gap:6px;">${h.voice} <span style="background:#22c55e11; border:1px solid #22c55e22; color:#22c55e; font-size:7px; padding:2px 6px; border-radius:10px;">${h.emotion}</span> • ${h.text}</div><div style="color:#555; font-size:8px; margin-top:3px;">${new Date(h.time).toLocaleTimeString()}</div></div><div style="display:flex; gap:6px;"><button onclick="playHistoryTTS(${i})" style="background:#111; border:1px solid #1a1a1a; color:#888; padding:7px 12px; border-radius:10px; font-size:9px; cursor:pointer; font-weight:700;">▶️ Play</button><button onclick="downloadHistoryTTS(${i})" style="background:#fff; color:#000; border:none; padding:7px 12px; border-radius:10px; font-size:9px; font-weight:800; cursor:pointer;">⬇️ Download</button></div>`; list.appendChild(d); }); }
window.playHistoryTTS=function(i){ const h=ttsHistory[i]; const ta=document.getElementById('ttsText'); if(ta){ ta.value=h.fullText; generateTTS(); } }; window.downloadHistoryTTS=function(i){ downloadTTS(); };
window.clearTTSHistory=function(){ ttsHistory=[]; renderTTSHistory(); }; window.downloadAllTTS=function(){ if(ttsHistory.length===0){ alert('No history!'); return; } alert('Would download all '+ttsHistory.length+' TTS files as ZIP - HD MP3'); };

initApp();
switchMain('tts');
})();
</script>
</div>
